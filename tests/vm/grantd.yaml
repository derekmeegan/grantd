# A real VM for testing grantd: real kernel, real systemd, real reboot.
#
# Ubuntu LTS, not Debian. Most people will install on Ubuntu, and every
# container test uses Debian.
#
# Lima reaches this machine over SSH. If the installer breaks sshd,
# `limactl shell` breaks with it, exactly as it does on a remote host.
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 2
memory: "2GiB"
disk: "20GiB"

# No mounts and no port forwards beyond Lima's own SSH. The VM must look like
# a plain server, not a development sandbox.
mounts: []
ssh:
  loadDotSSHPubKeys: false
