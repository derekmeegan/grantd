name: ci

# The `native-amd64` job is the important one. The other suites run in
# containers or under emulation. A locale bug that corrupted every signature on
# Ubuntu survived six green suites that way. A GitHub-hosted runner is a real
# amd64 VM with a real kernel, real systemd and real sshd, so the installer runs
# directly on the machine.
#
# It is also the only free way to test the systemd sandbox on amd64. User-mode
# qemu cannot create a private network namespace, so the local emulated run
# reports that assertion as skipped. Here it runs.
#
# `native-amd64` installs the published release named by GRANTD_VERSION, not
# the Go code in the checkout. That release must carry a signed VERSION file,
# or the installer refuses it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      origin:
        description: coordination service to test against
        required: false
        default: https://grantd.derekmeegan.workers.dev

permissions:
  contents: read

env:
  GRANTD_ORIGIN: ${{ github.event.inputs.origin || 'https://grantd.derekmeegan.workers.dev' }}
  # Actions are pinned to commit hashes. Update the hash and the comment together.
  GRANTD_VERSION: v0.2.0

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum
      - name: vet
        working-directory: go
        run: go vet ./...
      - name: test
        working-directory: go
        run: go test ./... -timeout 10m
      - name: the committed vectors match what the generator produces
        working-directory: go
        # A vector file edited by hand, or stale after a protocol change, makes
        # every conformance test agree with the wrong answer.
        run: |
          go run ./cmd/protocol-vectors /tmp/regen.json
          diff -u ../protocol/test-vectors/v1.json /tmp/regen.json

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  native-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: confirm this is a real amd64 machine, not a container
        run: |
          set -eu
          echo "arch:   $(uname -m)"
          echo "kernel: $(uname -r)"
          echo "virt:   $(systemd-detect-virt || true)"
          . /etc/os-release && echo "os:     $PRETTY_NAME"
          test "$(uname -m)" = "x86_64"
          # The sandbox assertions below only mean something on a machine where
          # systemd can build namespaces.
          #
          # systemd-detect-virt prints "none" and exits non-zero when there is
          # no container. `|| echo none` appends a second "none", so use
          # `|| true`.
          test "$(systemd-detect-virt --container 2>/dev/null || true)" = "none"
          sudo systemd-run --quiet --pipe --property=PrivateNetwork=yes /bin/true
          echo "systemd can create private network namespaces"

      - name: prepare an sshd and an enrolled account
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server >/dev/null
          grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
          sudo systemctl enable --now ssh
          sudo useradd -m -s /bin/bash agentuser

      - name: install from the published release
        run: |
          sudo install/install.sh --yes \
            --origin "$GRANTD_ORIGIN" --version "$GRANTD_VERSION" \
            --ssh-user agentuser --hostname 127.0.0.1

      - name: sshd survived and the services are up
        run: |
          set -eu
          sudo sshd -t
          systemctl is-active ssh
          systemctl is-active grant-signer.service
          systemctl is-active grantd.service

      - name: the systemd sandbox holds on real amd64
        run: |
          set -eu
          PID=$(systemctl show grant-signer.service -p MainPID --value)
          test -n "$PID" && test "$PID" != "0"

          # The trust root is confined to a namespace with only loopback. The
          # emulated amd64 run has to skip this assertion.
          IFACES=$(sudo nsenter -t "$PID" -n ip -o link show | awk -F': ' '{print $2}' | tr -d ' \n')
          echo "signer namespace interfaces: $IFACES"
          test "$IFACES" = "lo"

          # Prove it, instead of trusting the interface list.
          if sudo nsenter -t "$PID" -n -- curl -s --max-time 5 -o /dev/null "$GRANTD_ORIGIN"; then
            echo "signer reached the network; the sandbox is not holding" >&2
            exit 1
          fi
          echo "signer cannot reach the network"

          # The daemon is the process assumed to be compromised. File
          # permissions exclude it first.
          ! sudo -u grantd cat /etc/grantd/ssh_ca 2>/dev/null
          ! sudo -u grantd cat /var/lib/grant-signer/state.db 2>/dev/null
          ! sudo -u grantd test -r /run/grantd/owner/owner.sock
          echo "daemon cannot reach key material or the owner socket"

          # Then the unit's mount namespace hides the paths from everyone,
          # root included.
          DPID=$(systemctl show grantd.service -p MainPID --value)
          test -n "$DPID" && test "$DPID" != "0"
          sudo nsenter -t "$DPID" -m -- true
          ! sudo nsenter -t "$DPID" -m -- test -e /etc/grantd/ssh_ca
          ! sudo nsenter -t "$DPID" -m -- test -e /var/lib/grant-signer/state.db
          echo "inside the daemon's mount namespace the key material does not exist"

      - name: capability URL to SSH session, with no client installed
        run: |
          set -eu
          for i in $(seq 1 30); do
            sudo journalctl -u grantd.service -b --no-pager | grep -q "rendezvous connected" && break
            sleep 2
          done
          sudo journalctl -u grantd.service -b --no-pager | grep -q "rendezvous connected"

          URL=$(sudo -u agentuser curl -s --unix-socket /run/grantd/owner/owner.sock \
                  -X POST http://localhost/grants -H 'content-type: application/json' \
                  -d '{"ttl_seconds":600}' \
                | sed -n 's/.*"capability_url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          case "$URL" in https://*) ;; *) echo "mint failed: $URL" >&2; exit 1 ;; esac
          sleep 3

          sudo -u agentuser env GRANTD_IDENTITY=/tmp/v/id.pem \
            sh install/redeem.sh --out /tmp/v "$URL"

          OUT=$(sudo -u agentuser ssh -i /tmp/v/id_ed25519 \
                  -o CertificateFile=/tmp/v/id_ed25519-cert.pub -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR agentuser@127.0.0.1 whoami)
          echo "logged in as: $OUT"
          test "$OUT" = "agentuser"

      - name: the shell client agrees with the frozen vectors, in both locales
        run: |
          # gawk is the default here. This is where the UTF-8 %c bug lives.
          awk --version | head -1
          sh tests/e2e/cbe-vectors.sh install/redeem.sh protocol/test-vectors/v1.json

      - name: the node client agrees with the frozen vectors
        run: node tests/e2e/node-vectors.mjs

      # Every environment this code is written in has direct egress, so a
      # client that ignores a configured proxy looks correct everywhere except
      # the sandboxes it is meant for. This asserts the proxy saw the request,
      # not that the request succeeded.
      - name: the node client uses a configured proxy
        run: node tests/e2e/node-proxy.mjs

      - name: uninstall cleanly
        run: |
          set -eu
          sudo install/uninstall.sh --yes
          sudo sshd -t
          systemctl is-active ssh
          test ! -e /etc/grantd/ssh_ca
          test ! -e /etc/ssh/sshd_config.d/60-grantd.conf

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum
      - name: end to end, host and visitor in separate containers
        run: |
          tests/e2e/run.sh --origin "$GRANTD_ORIGIN" --public-origin "$GRANTD_ORIGIN"
